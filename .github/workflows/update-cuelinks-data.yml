name: Update CueLinks data

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cuelinks-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Convert catalog product links with CueLinks
        env:
          CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY }}
          CUELINKS_CHANNEL_ID: ${{ secrets.CUELINKS_CHANNEL_ID }}
        run: node scripts/apply-cuelinks.mjs

      - name: Fetch CueLinks partner offers
        env:
          CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY }}
        run: node scripts/fetch-cuelinks-offers.mjs

      - name: Commit updated catalog and offers
        run: |
          if [ -z "$(git status --porcelain -- data/catalog.json data/cuelinks-offers.json)" ]; then
            echo "No catalog or offer changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/cuelinks-offers.json
          git commit -m "chore: refresh CueLinks catalog and offers"
          git push
