name: Update affiliate data

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: affiliate-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Convert catalog product links with CueLinks
        env:
          CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY }}
          CUELINKS_CHANNEL_ID: ${{ secrets.CUELINKS_CHANNEL_ID }}
        run: node scripts/apply-cuelinks.mjs

      - name: Fetch CueLinks partner offers
        env:
          CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY }}
        run: node scripts/fetch-cuelinks-offers.mjs

      - name: Fetch CJ partner offers
        env:
          CJ_ACCESS_TOKEN: ${{ secrets.CJ_ACCESS_TOKEN }}
          CJ_WEBSITE_ID: ${{ secrets.CJ_WEBSITE_ID }}
        run: node scripts/fetch-cj-offers.mjs

      - name: Fetch CJ products
        env:
          CJ_ACCESS_TOKEN: ${{ secrets.CJ_ACCESS_TOKEN }}
          CJ_COMPANY_ID: ${{ secrets.CJ_COMPANY_ID }}
          CJ_WEBSITE_ID: ${{ secrets.CJ_WEBSITE_ID }}
        run: node scripts/fetch-cj-products.mjs

      - name: Commit updated affiliate data
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No affiliate data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: refresh affiliate data"
          git push
